services:

  postgres:
    image: postgres:16
    container_name: estore-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: estore-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: estore-backend
    restart: always
    ports:
      - "4000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    env_file:
      - .env
    volumes:                                        
      - uploads_data:/usr/src/app/uploads 
      - ../e-store-front-end/public/models:/app/public/models

  ai-service:
    build:
      context: ../e-store-ai
      dockerfile: Dockerfile
    container_name: estore-ai
    restart: always
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  uploads_data: